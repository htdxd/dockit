[project]
name = "skill-toolbox"
version = "0.1.0"
description = "A lightweight runtime for artifact-producing AI skills"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "openai>=2.50.0",
    "pillow>=12.3.0",
    "platformdirs>=4.11.0",
    "python-docx>=1.2.0",
    "pymupdf>=1.28.0",
    "pywin32>=312; sys_platform == 'win32'",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "mammoth==1.12.0",
    "skia-pathops>=0.9.2",
    "uharfbuzz==0.55.0",
]

[project.scripts]
skill-toolbox-sidecar = "skill_toolbox.sidecar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/skill_toolbox"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "e2e: 需要真实环境（Word COM/渲染器）的端到端测试，环境缺失时 skip",
]
pythonpath = ["backend"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]
