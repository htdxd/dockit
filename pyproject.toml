[project]
name = "skill-toolbox"
version = "0.1.0"
description = "A lightweight runtime for artifact-producing AI skills"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "openai>=2.50.0",
    "pillow>=12.3.0",
    "platformdirs>=4.11.0",
    "python-docx>=1.2.0",
]

[project.scripts]
skill-toolbox-sidecar = "skill_toolbox.sidecar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/skill_toolbox"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["backend"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

