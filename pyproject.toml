[project]
name = "skill-toolbox"
version = "0.4.0"
description = "DocKit Resume: AI-assisted Chinese resumes with measured Word layouts"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "openai>=2.50.0",
    "pillow>=12.3.0",
    "platformdirs>=4.11.0",
    "python-docx>=1.2.0",
    "pymupdf>=1.28.0",
    "pywin32>=312; sys_platform == 'win32'",
]

[project.scripts]
skill-toolbox-sidecar = "skill_toolbox.sidecar:main"

[project.optional-dependencies]
web = [
    "fastapi>=0.141.1",
    "psutil>=7.2.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/skill_toolbox"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "e2e: 需要真实环境（Word COM/渲染器）的端到端测试，环境缺失时 skip",
]
pythonpath = ["backend"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]
